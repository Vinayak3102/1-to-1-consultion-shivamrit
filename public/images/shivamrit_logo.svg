<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="sacredGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDF4DC" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#D4AF37" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#8C6D1F" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#050B14" />
    </radialGradient>
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="40%" stop-color="#E5C158" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997722" />
    </linearGradient>
    <filter id="auraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Sacred Sanctum Background -->
  <circle cx="50" cy="50" r="48" fill="#070E1A" stroke="url(#goldSheen)" stroke-width="2" />
  
  <!-- Subtle Pranic Radiation Ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#D4AF37" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Sacred Lotus / Bio-Energy Aura Petals -->
  <g fill="none" stroke="url(#goldSheen)" stroke-width="1.2" opacity="0.85">
    <path d="M50 20 C42 35 42 60 50 78 C58 60 58 35 50 20 Z" fill="url(#goldSheen)" fill-opacity="0.15" />
    <path d="M50 24 C34 38 34 58 45 74 C40 60 42 42 50 24 Z" fill="url(#goldSheen)" fill-opacity="0.1" />
    <path d="M50 24 C66 38 66 58 55 74 C60 60 58 42 50 24 Z" fill="url(#goldSheen)" fill-opacity="0.1" />
    <path d="M50 30 C26 44 32 68 50 78" />
    <path d="M50 30 C74 44 68 68 50 78" />
  </g>

  <!-- Sacred Amrit Drop (Divine Elixir) & Om Bindu -->
  <path d="M50 34 C44 42 43 50 47 54 C50 57 53 57 56 54 C60 50 59 42 50 34 Z" fill="url(#goldSheen)" filter="url(#auraGlow)" />
  <circle cx="50" cy="48" r="2.5" fill="#070E1A" />
  <circle cx="50" cy="48" r="1.2" fill="#FFF3C4" />

  <!-- Sacred Base Trishul Accent -->
  <path d="M43 72 Q50 75 57 72" stroke="url(#goldSheen)" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <circle cx="50" cy="62" r="1.5" fill="url(#goldSheen)" />

  <!-- Inner Radiant Center Core -->
  <circle cx="50" cy="50" r="1" fill="#FFFFFF" />
</svg>
